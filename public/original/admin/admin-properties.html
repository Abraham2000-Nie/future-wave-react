<!DOCTYPE html>
<html>
<head>
    <title>Admin - Manage Properties</title>
    <link rel="stylesheet" href="admin-css/admin-properties.css">
</head>

<body>

<h1>Manage Properties</h1>

<div class="main-container">

    <div class="add-box">
        <h2>Add New Property</h2>

        <select id="placeSelect"></select>

        <input type="text" id="propertyName" placeholder="Property Name">
        <input type="text" id="propertyDesc" placeholder="Description">
        <input type="date" id="propertyDate">

        <button onclick="addProperty()">Add Property</button>
    </div>

    <div class="list-box">
        <h2>Existing Properties</h2>

        <select id="viewPlace" onchange="loadProperties()"></select>

        <div id="propertiesList"></div>
    </div>

</div>

<button class="back" onclick="goBack()">Back to Dashboard</button>

<script src="admin-js/admin-properties.js"></script>

</body>
</html>
