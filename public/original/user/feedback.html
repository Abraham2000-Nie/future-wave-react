<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Future Wave - Feedback</title>
    <link rel="stylesheet" href="css/feedback.css">
</head>
<body>


    <div class="feedback-box">
        <h1>Feedback</h1>
        <p>Your feedback helps us improve Future Wave</p>

        <form onsubmit="submitFeedback(); return false;">

    <input type="text" id="name" placeholder="Your Name" required>

    <input type="email" id="email" placeholder="Your Email" required>

    <textarea id="message" placeholder="Enter your feedback here..." required></textarea>

    <button type="submit">Submit</button>

    <button type="button" onclick="window.location.href='dashboard.html'">Go Back</button>

        </form>
    </div>

    <script src="js/feedback.js"></script>
</body>
</html>
